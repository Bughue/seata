name: "Publish Docker Image"

# Version branches (2.7.0, 2.6.0, ...) must not publish official tags or
# retarget latest on every push. That published unreleased 2.7.0 before
# the vote. Snapshot images stay on snapshot/2.x (+ the daily schedule).
# Official tags are workflow_dispatch only, after the release vote passes.
on:
  push:
    branches: [ snapshot, 2.x ]
  schedule:
    - cron: '0 16 * * *' #GMT+0
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish official version tags and latest. Use only after the release vote passes.'
        type: boolean
        default: false

jobs:
  # job 1
  publish-images-to-dockerhub:
    name: "Publish images to DockerHub"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 17, 21, 25 ]
    steps:
      # step 1
      - name: "Checkout"
        uses: actions/checkout@v3
      # step 2
      - name: "Setup Java JDK"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      # step 3
      - name: "Print maven version"
        run: ./mvnw -version
      # step 4 snapshot/dev java8 (never release-image)
      - name: "Publish snapshot images to DockerHub based on java8"
        if: ${{ matrix.java == 8 && (github.event_name != 'workflow_dispatch' || inputs.publish_release == false) }}
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USER }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./mvnw -T 4C clean package -Dimage.name=eclipse-temurin:8u422-b05-jdk -Pimage -DskipTests -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      # official tags: only workflow_dispatch with publish_release=true after the vote
      - name: "Publish official images to DockerHub based on java8"
        if: ${{ matrix.java == 8 && github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USER }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./mvnw -T 4C clean package -Dimage.name=eclipse-temurin:8u422-b05-jdk -Pimage,release-image-based-on-java8 -DskipTests -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      - name: "Publish official images to DockerHub based on java17"
        if: ${{ matrix.java == 17 && github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USER }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./mvnw -T 4C clean package -Dimage.name=eclipse-temurin:17.0.12_7-jdk -Pimage,release-image-based-on-java17 -DskipTests -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      - name: "Publish official images to DockerHub based on java21"
        if: ${{ matrix.java == 21 && github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USER }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./mvnw -T 4C clean package -Dimage.name=eclipse-temurin:21.0.4_7-jdk -Pimage,release-image-based-on-java21 -DskipTests -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      - name: "Publish official images to DockerHub based on java25"
        if: ${{ matrix.java == 25 && github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USER }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ./mvnw -T 4C clean package -Dimage.name=eclipse-temurin:25-jdk -Pimage,release-image-based-on-java25 -DskipTests -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
